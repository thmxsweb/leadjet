name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.3.1)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Binaries, Windows + Linux installers, npm
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm run check

      - name: Build standalone binaries (win/macOS/linux)
        run: pnpm run build:binaries

      - name: Windows installer (NSIS -> Program Files + PATH)
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y nsis
          curl -fsSL -o /tmp/envar.zip https://nsis.sourceforge.io/mediawiki/images/7/7f/EnVar_plugin.zip
          sudo unzip -o /tmp/envar.zip -d /usr/share/nsis
          makensis -DVERSION=${TAG#v} installer/leadjet.nsi

      - name: Linux installers (.deb + .rpm via fpm)
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y ruby ruby-dev rpm build-essential
          sudo gem install --no-document fpm
          VER=${TAG#v}
          chmod +x release/leadjet-linux
          mkdir -p pkgroot/usr/bin
          cp release/leadjet-linux pkgroot/usr/bin/leadjet
          fpm -s dir -t deb -n leadjet -v "$VER" -a amd64 \
            --description "Find, enrich and score local business leads." \
            --maintainer "thmxsweb <322552692+thmxsweb@users.noreply.github.com>" \
            --license MIT --url "https://github.com/thmxsweb/leadjet" \
            -C pkgroot -p release/leadjet-linux.deb usr/bin/leadjet
          fpm -s dir -t rpm -n leadjet -v "$VER" -a x86_64 \
            --description "Find, enrich and score local business leads." \
            --maintainer "thmxsweb" --license MIT --url "https://github.com/thmxsweb/leadjet" \
            -C pkgroot -p release/leadjet-linux.rpm usr/bin/leadjet
          ls -la release

      - name: Share macOS binary with the pkg job
        uses: actions/upload-artifact@v4
        with:
          name: macos-bin
          path: release/leadjet-macos

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release/leadjet-win.exe
            release/leadjet-macos
            release/leadjet-linux
            release/leadjet-setup.exe
            release/leadjet-linux.deb
            release/leadjet-linux.rpm

      - name: Publish to npm (if token configured)
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  macos-installer:
    name: macOS installer (.pkg)
    needs: build
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-bin
          path: release
      - name: Build .pkg (installs to /usr/local/bin/leadjet)
        run: |
          VER=${TAG#v}
          mkdir -p pkgroot/usr/local/bin
          cp release/leadjet-macos pkgroot/usr/local/bin/leadjet
          chmod +x pkgroot/usr/local/bin/leadjet
          pkgbuild --identifier co.thmxsweb.leadjet --version "$VER" \
            --root pkgroot --install-location / release/leadjet-macos.pkg
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          fail_on_unmatched_files: false
          files: release/leadjet-macos.pkg
